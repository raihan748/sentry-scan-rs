[package]
name = "sentry-scan"
version = "0.1.0"
edition = "2021"
authors = ["Developer <developer@telkom.sch.id>"]
description = "High-concurrency async TCP CIDR port scanner & service banner reconnaissance CLI"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
ipnet = "2.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
colored = "2.1"

[[bin]]
name = "sentry-scan"
path = "src/main.rs"

[lib]
name = "sentry_scan"
path = "src/lib.rs"
